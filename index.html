<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello - Personal Greeting</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            max-width: 550px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 35px;
            text-align: center;
            font-size: 3em;
            font-weight: 700;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .input-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid transparent;
            background: linear-gradient(white, white) padding-box,
                        linear-gradient(135deg, #667eea, #764ba2) border-box;
            border-radius: 15px;
            font-size: 17px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.1);
        }

        input[type="text"]:focus {
            outline: none;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .greeting {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            font-size: 1.6em;
            font-weight: 600;
            margin-bottom: 30px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.4s ease;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .greeting:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .info-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(102, 126, 234, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .info-card:hover::before {
            left: 100%;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.15);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .info-card h3 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            font-size: 1.2em;
            font-weight: 600;
        }

        .info-card p {
            color: #555;
            font-size: 1em;
            line-height: 1.8;
        }

        .datetime {
            font-weight: 600;
            color: #333;
            font-size: 1.05em;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .weather-info p {
            margin: 3px 0;
        }

        .weather-icon {
            font-size: 2em;
        }

        .loading {
            color: #999;
            font-style: italic;
        }

        .error {
            color: #e74c3c;
            font-weight: 500;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .container {
                padding: 30px;
            }

            h1 {
                font-size: 2.2em;
            }

            .greeting {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 Hello!</h1>

        <div class="input-group">
            <label for="nameInput">Enter your name:</label>
            <input type="text" id="nameInput" placeholder="Type your name here..." autocomplete="off">
        </div>

        <div class="greeting" id="greeting">
            Hello! Please enter your name above.
        </div>

        <div class="info-card">
            <h3>📅 Current Date & Time</h3>
            <p class="datetime" id="datetime">Loading...</p>
        </div>

        <div class="info-card">
            <h3>🌤️ Current Weather</h3>
            <div class="weather-info" id="weather">
                <p class="loading">Loading weather data...</p>
            </div>
        </div>
    </div>

    <script>
        // Greeting functionality
        const nameInput = document.getElementById('nameInput');
        const greeting = document.getElementById('greeting');

        nameInput.addEventListener('input', (e) => {
            const name = e.target.value.trim();
            if (name) {
                greeting.textContent = `Hello, ${name}! 🎉`;
            } else {
                greeting.textContent = 'Hello! Please enter your name above.';
            }
        });

        // Date and Time functionality
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            document.getElementById('datetime').textContent = now.toLocaleString('en-US', options);
        }

        // Update time every second
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // Weather functionality
        async function getWeather() {
            const weatherDiv = document.getElementById('weather');

            try {
                // Try to get user's location
                if ('geolocation' in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        async (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;

                            try {
                                // Using wttr.in API for weather data
                                const response = await fetch(`https://wttr.in/${lat},${lon}?format=j1`);
                                const data = await response.json();

                                const current = data.current_condition[0];
                                const location = data.nearest_area[0];

                                weatherDiv.innerHTML = `
                                    <div>
                                        <p><strong>Location:</strong> ${location.areaName[0].value}, ${location.country[0].value}</p>
                                        <p><strong>Temperature:</strong> ${current.temp_C}°C (${current.temp_F}°F)</p>
                                        <p><strong>Condition:</strong> ${current.weatherDesc[0].value}</p>
                                        <p><strong>Humidity:</strong> ${current.humidity}%</p>
                                        <p><strong>Wind:</strong> ${current.windspeedKmph} km/h</p>
                                    </div>
                                `;
                            } catch (error) {
                                weatherDiv.innerHTML = '<p class="error">Failed to load weather data. Please try again later.</p>';
                            }
                        },
                        (error) => {
                            // If location permission denied, use default location
                            fetchDefaultWeather();
                        }
                    );
                } else {
                    fetchDefaultWeather();
                }
            } catch (error) {
                weatherDiv.innerHTML = '<p class="error">Weather service unavailable.</p>';
            }
        }

        async function fetchDefaultWeather() {
            const weatherDiv = document.getElementById('weather');
            try {
                // Default to a major city if geolocation is not available
                const response = await fetch('https://wttr.in/London?format=j1');
                const data = await response.json();

                const current = data.current_condition[0];
                const location = data.nearest_area[0];

                weatherDiv.innerHTML = `
                    <div>
                        <p><strong>Location:</strong> ${location.areaName[0].value}, ${location.country[0].value} (default)</p>
                        <p><strong>Temperature:</strong> ${current.temp_C}°C (${current.temp_F}°F)</p>
                        <p><strong>Condition:</strong> ${current.weatherDesc[0].value}</p>
                        <p><strong>Humidity:</strong> ${current.humidity}%</p>
                        <p><strong>Wind:</strong> ${current.windspeedKmph} km/h</p>
                    </div>
                `;
            } catch (error) {
                weatherDiv.innerHTML = '<p class="error">Failed to load weather data.</p>';
            }
        }

        // Load weather on page load
        getWeather();
    </script>
</body>
</html>
